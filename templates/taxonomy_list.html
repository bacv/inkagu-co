{% extends "base.html" %}

{% block content %}
<h1>{{ taxonomy.name | capitalize }}</h1>
<ul>
    {# Sort by name, or use .items to see term counts #}
    {% for term in terms %}
    <li>
        <a href="{{ term.permalink }}">{{ term.name }}</a> 
        <small>({{ term.pages | length }} entries)</small>
    </li>
    {% endfor %}
</ul>
<p class="info">
    <a href="/tags">/tags</a> 
    <a href="/meta">/meta</a> 
    <a href="/threads">/threads</a> 
</p>
{% endblock content %}
